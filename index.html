<style>
  :root{
    --ink:#1c1a17;
    --paper:#fbf8f3;
    --brand-rgb: 178, 58, 40;
    --gold-rgb: 191, 148, 66;
    --muted:#7a736a;
  }
  html{scroll-behavior:smooth;}
  body{
    font-family:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -8%, rgba(var(--gold-rgb),.16), transparent 60%),
      radial-gradient(900px 500px at 92% 4%, rgba(var(--brand-rgb),.10), transparent 62%),
      linear-gradient(180deg,#fdfbf7 0%, #f6f1e8 52%, #efe8dc 100%);
    background-attachment:fixed;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(rgba(28,26,23,.05) 1px, transparent 1px);
    background-size:22px 22px;
    opacity:.55;
  }
  .serif-display{font-family:'Songti SC','STSong','SimSun',Georgia,serif;}
  .zen-line{
    height:1px; flex:1;
    background:linear-gradient(90deg, rgba(var(--brand-rgb),.55), rgba(var(--gold-rgb),.15), transparent);
  }
  /* 文章卡片 */
  .piece-card{
    position:relative;
    background:linear-gradient(180deg,#ffffff 0%, #fdfbf7 100%);
    border:1px solid rgba(28,26,23,.09);
    border-radius:14px;
    box-shadow:0 1px 2px rgba(28,26,23,.04), 0 14px 30px -22px rgba(28,26,23,.35);
    transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s cubic-bezier(.2,.8,.2,1), border-color .4s ease;
    overflow:hidden;
  }
  .piece-card::after{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, rgba(var(--brand-rgb),.85), rgba(var(--gold-rgb),.7));
    transform:scaleY(.28); transform-origin:top;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .piece-card:hover{
    transform:translateY(-4px);
    box-shadow:0 2px 4px rgba(28,26,23,.05), 0 26px 46px -26px rgba(28,26,23,.42);
    border-color:rgba(var(--brand-rgb),.28);
  }
  .piece-card:hover::after{transform:scaleY(1);}
  .piece-card.is-open{border-color:rgba(var(--brand-rgb),.45); box-shadow:0 2px 4px rgba(28,26,23,.06), 0 30px 50px -26px rgba(28,26,23,.45);}
  .piece-card.is-open::after{transform:scaleY(1);}
  .piece-body{
    display:none;
  }
  .piece-card.is-open .piece-body{display:block; animation:unfold .45s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes unfold{from{opacity:.92; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .piece-text p{line-height:1.8; text-indent:2em; margin:0 0 14px;}
  .piece-text p:first-of-type::first-letter{
    font-family:'Songti SC','STSong','SimSun',Georgia,serif;
    font-size:1.9em; font-weight:700; float:left; line-height:1; padding:2px 8px 0 0;
    color:rgb(var(--brand-rgb));
  }
  .tag-chip{
    font-size:12px; letter-spacing:.06em;
    color:rgb(var(--brand-rgb));
    background:rgba(var(--brand-rgb),.07);
    border:1px solid rgba(var(--brand-rgb),.18);
    border-radius:999px; padding:2px 10px;
  }
  .alpha-badge{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700; font-size:20px; line-height:1;
    color:#fff;
    background:linear-gradient(140deg, rgb(var(--brand-rgb)), #8f2f22);
    border-radius:10px;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px -10px rgba(var(--brand-rgb),.9);
    flex-shrink:0;
  }
  .filter-btn{
    transition:all .28s cubic-bezier(.2,.8,.2,1);
    border:1px solid rgba(28,26,23,.14);
    background:rgba(255,255,255,.72);
    color:var(--ink);
  }
  .filter-btn:hover{border-color:rgba(var(--brand-rgb),.4); background:rgba(255,255,255,.95);}
  .filter-btn.is-active{
    background:linear-gradient(140deg, rgb(var(--brand-rgb)), #8f2f22);
    border-color:rgb(var(--brand-rgb));
    color:#fff;
    box-shadow:0 10px 22px -12px rgba(var(--brand-rgb),.95);
  }
  .search-input:focus{
    outline:none;
    border-color:rgba(var(--brand-rgb),.55);
    box-shadow:0 0 0 4px rgba(var(--brand-rgb),.12);
    background:#fff;
  }
  .stat-num{font-family:Georgia,'Times New Roman',serif; font-weight:700;}
  .reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes rise{from{opacity:.92; transform:translateY(10px);} to{opacity:1; transform:none;}}
  mark{background:rgba(var(--gold-rgb),.35); color:inherit; padding:0 2px; border-radius:3px;}
  .empty-state{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
  ::selection{background:rgba(var(--brand-rgb),.22);}
</style>

<script>
/* =========================================================
   文章数据：此处为示例文章，用户可自行替换 title / author / tag / category 与正文段落
   正文写在 paragraphs 数组里，每项是一段
   ========================================================= */
const ARTICLES = [
  {
    id: 1, title: "温情人间", author: "徐芝润", tag: "随笔", date: "2026-03-04",
    paragraphs: [
      '人间最动人的温情，从来不藏在轰轰烈烈的大事里，而是藏在一碗汤、一盏灯、一句轻声的叮嘱中。这些细碎的温暖，像冬日里的一缕阳光，悄无声息地照进我的生活，成为我记忆中最柔软的部分。',
      '那是去年深秋的一个夜晚，窗外的风呼呼地刮着，枯黄的树叶被卷起，啪啪地拍打着玻璃。我坐在书桌前，面前堆着写不完的试卷和密密麻麻的笔记。台灯的光照得我眼睛发酸，手指因为长时间握笔而有些僵硬。墙上的时钟已经悄悄滑过了十点。',
      '"还没睡呢?"母亲轻手轻脚地推开门，手里端着一碗热气腾腾的汤。白色的雾气氤氲而上，模糊了她略显疲惫的面容，却清晰地映出她关切的眼神。"趁热喝吧，补补身子。"她的声音很轻，像怕惊扰了我的思绪。',
      '我放下笔，接过碗。指尖触碰到碗壁的那一刻，一股暖意顺着指尖蔓延到全身。碗里的汤飘着淡淡的清香，是我最爱喝的排骨莲藕汤。莲藕炖得软糯，排骨熬出了浓郁的汤汁，表面还浮着几颗红枣。我小口啜饮着，温热的液体顺着喉咙滑入胃里，瞬间驱散了周身的寒意，也融化了心中积攒了一整天的疲惫。',
      '母亲没有多说什么，只是静静地站在一旁，看着我喝完。她粗糙的手指轻轻抚过我的发梢，那动作里藏着无尽的包容与爱意。灯光下，我突然发现她的鬓角不知何时多了几缕银丝，在暖黄色的光里显得格外刺眼。',
      '那一刻，我忽然意识到，在这快节奏的生活里，这份无声的陪伴是多么珍贵。母亲的爱，从来不是轰轰烈烈的宣言，而是藏在这些细枝末节里的温情--是一碗热汤，是一次轻手轻脚的进门，是一个关切的眼神，是无数个深夜里默默守候的身影。',
      '如今，每当我在深夜伏案时，总会想起那碗汤的温度。它让我明白，温情无处不在，它藏在生活的每一个角落，等待着我们去发现、去珍惜。而我也渐渐懂得，最好的回报，不是华丽的承诺，而是用自己的努力，让那些默默守候的人放心、骄傲。',
      '一碗汤的温度，足以抵御世间所有的严寒。这就是温情人间--平凡，却足够温暖。'
    ]
  },
  {
    id: 2, title: "一笺四季，满目芳华", author: "徐芝润", tag: "散文", date: "2026-02-18",
    paragraphs: [
      '日升日落，春秋代序，自然以四季为笔，蘸取不同景致的墨色，在天地间铺展成一幅幅鲜活的画卷。每一个季节都有自己独特的灵魂，等待着我们去发现、去感受。',
      '春天，是万物苏醒的季节。当第一缕春风拂过大地，沉睡了一冬的小草便悄悄探出了嫩绿的脑袋，好奇地打量着这个世界。柳树的枝条也变得柔软起来，像少女的长发在风中轻轻摇曳。桃花、杏花、梨花竞相开放，粉的像霞，白的像雪，红的像火，把山坡染成了五彩斑斓的画布。春雨绵绵，细如牛毛，落在脸上凉丝丝的，带着泥土和青草的芬芳。解冻的小溪叮叮咚咚地唱着歌，仿佛在诉说着春天的故事。燕子从南方飞回来了，在屋檐下忙碌地筑巢，叽叽喳喳的叫声为春天增添了无限的生机。走在春天的田野里，深吸一口气，满是清新的气息，让人心旷神怡。',
      '夏天，是热情奔放的季节。清晨，太阳早早地爬上了天空，金色的阳光洒满大地，树叶被照得发亮，绿得发黑。中午，蝉在树梢上不知疲倦地叫着“知了知了”，声音此起彼伏，像是在举行一场盛大的音乐会。池塘里，荷花盛开了，粉的、白的，亭亭玉立地站在碧绿的荷叶之间，微风吹过，送来阵阵清香。傍晚时分，一场突如其来的暴雨倾盆而下，雨点打在窗户上噼里啪啦地响，天地间仿佛挂起了一道巨大的水帘。雨过天晴后，天边架起了一道彩虹，空气格外清新，青蛙在稻田里呱呱地叫着，萤火虫在草丛中一闪一闪，像天上的星星落了下来。夏夜的星空格外明亮，躺在院子里的竹椅上数星星，是童年最难忘的记忆。',
      '秋天，是成熟丰收的季节。秋风送爽，天空变得格外高远，蓝得像一块巨大的宝石。走在乡间的小路上，放眼望去，金黄的稻田像铺了一地的黄金，沉甸甸的稻穗笑弯了腰。果园里，红彤彤的苹果挂满枝头，黄澄澄的梨子散发着诱人的香气，紫莹莹的葡萄像一串串玛瑙。枫叶红了，一片片像燃烧的火焰，风一吹，便如蝴蝶般翩翩起舞，落在地上铺成了一条红色的地毯。踩上去发出“沙沙”的响声，那是秋天独有的声音。秋天的夜晚，月光格外皎洁，桂花开了，香气能飘到很远很远的地方。坐在窗前，闻着桂花香，读一本喜欢的书，是一种说不出的惬意。',
      '冬天，是静谧纯净的季节。清晨推开窗，外面已经变成了一个银装素裹的世界。雪花还在纷纷扬扬地飘落，像无数只白色的蝴蝶在空中飞舞。屋顶上、树枝上、地面上，全都盖上了一层厚厚的棉被。整个世界安静极了，只有脚踩在雪地上发出“咯吱咯吱”的声音。光秃秃的树枝上挂满了晶莹剔透的冰凌，在阳光下闪闪发光。墙角处，几朵梅花傲然绽放，红的、白的，在皑皑白雪中显得格外娇艳，散发着淡淡的清香。孩子们穿着厚厚的棉衣，在雪地里堆雪人、打雪仗，欢声笑语回荡在整个小院。屋子里，一家人围坐在火炉旁，喝着热腾腾的姜茶，窗外寒风呼啸，屋内却暖意融融，这就是冬天最温暖的画面。',
      '春生夏长，秋收冬藏，四时交替，各有风华。春天的希望、夏天的热情、秋天的充实、冬天的宁静，构成了生命最完整的循环。我们应该珍惜每一个季节，珍惜每一个时刻，因为每一个季节，都是大自然赠予我们最珍贵的礼物。用心去感受四季的变化，你会发现，生活本身就是一首最美的诗。'
    ]
  },
  {
    id: 3, title: "乡间美景", author: "谢意桐", tag: "散文", date: "2026-01-09",
    paragraphs: [
      '我喜欢乡间的美景，无论什么时候的乡间我都喜欢，它们给我的形象和记忆永远是最美的。',
      '清晨，当第一缕太阳穿过小山，第一束阳光照在云朵上，小山上，小溪里，天上的棉花糖在小贩手中变来变去，五颜六色的，远处的小山给一位画家画得活了过来，小溪在阳光的照耀下变成了金灿灿的，太阳透过澄清的水面照射在沙石上。',
      '下午，太阳炽烤着大地，有几个小孩蹦蹦跳跳的跑了过来，手里拿着渔网和小桶，这时太阳躲到了云朵后面好似不想让他们晒太多的太阳吧，太阳也许是想和云朵们讲悄悄话吧。',

function countWords(a){
  return a.paragraphs.join('').replace(/\s/g,'').length;
}
function firstLetter(title){
  const ch = (title || '').trim().charAt(0);
  if(/[A-Za-z]/.test(ch)) return ch.toUpperCase();
  if(/[\u4e00-\u9fa5]/.test(ch)) return ch; // 中文取首字
  return '#';
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeReg(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(text, kw){
  const safe = escapeHtml(text);
  if(!kw) return safe;
  const re = new RegExp('(' + escapeReg(escapeHtml(kw)) + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

    return '<button type="button" class="filter-btn h-[36px] min-w-[36px] px-2.5 rounded-full text-[14px] font-medium shrink-0' +
      (activeLetter === L ? ' is-active' : '') + '" data-letter="' + L + '">' +
      (isAll ? '全部' : L) + '</button>';
  }).join('');
  letterBar.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      const L = btn.getAttribute('data-letter');
      // 每次都给出可观察反馈：更新选中态 + 结果提示 + 列表刷新
      activeLetter = L;
      renderLetterBar();
      render();
      resultHint.textContent = '已切换筛选：' + (L === 'ALL' ? '全部首字' : '首字「' + L + '」') + '，共 ' + getVisible().length + ' 篇';
    });
  });
}
/* ================= 排序 + 过滤 ================= */
function getVisible(){
  let arr = ARTICLES.slice();
  const kw = keyword.trim().toLowerCase();
  if(kw){
    arr = arr.filter(function(a){
      return a.title.toLowerCase().indexOf(kw) > -1;
    });
  }
  if(activeLetter !== 'ALL'){
    if(activeLetter === '中'){
      arr = arr.filter(function(a){
        const L = firstLetter(a.title);
        return /[\u4e00-\u9fa5]/.test(L);
      });
    }else{
      arr = arr.filter(function(a){ return firstLetter(a.title) === activeLetter; });
    }
  }
  arr.sort(function(a, b){
    const A = a.title, B = b.title;
    if(A < B) return sortAsc ? -1 : 1;
    if(A > B) return sortAsc ? 1 : -1;
    return 0;
  });
  return arr;
}
/* ================= 渲染列表 ================= */
function render(){
  const arr = getVisible();
  const kw = keyword.trim();
  statShown.textContent = arr.length;
  resultHint.textContent = kw
    ? '搜索「' + kw + '」共找到 ' + arr.length + ' 篇文章' + (activeLetter !== 'ALL' ? '（限定首字：' + activeLetter + '）' : '')
    : (activeLetter !== 'ALL' ? '当前按首字「' + activeLetter + '」筛选，共 ' + arr.length + ' 篇' : '共展出 ' + arr.length + ' 篇文章');
  if(arr.length === 0){
    listEl.innerHTML = '';
    emptyState.classList.remove('hidden');
    return;
  }
  emptyState.classList.add('hidden');
  listEl.innerHTML = arr.map(function(a, i){
    const words = countWords(a);
    const letter = firstLetter(a.title);
    return '' +
    '<article class="piece-card reveal p-5 md:p-6" data-id="' + a.id + '" style="animation-delay:' + (i * 45) + 'ms">' +
      '<button type="button" class="w-full text-left piece-toggle" aria-expanded="false">' +
        '<div class="flex items-start gap-4">' +
          '<span class="alpha-badge">' + escapeHtml(letter) + '</span>' +
          '<div class="flex-1 min-w-0">' +
            '<h2 class="serif-display text-[20px] md:text-[22px] font-bold leading-snug text-[#1c1a17]">' + highlight(a.title, kw) + '</h2>' +
            '<div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-2.5 text-[13px] text-[var(--muted)]">' +
              '<span>' + escapeHtml(a.author) + '</span>' +
              '<span class="text-[rgba(28,26,23,.2)]">·</span>' +
              '<span>' + escapeHtml(a.date) + '</span>' +
              '<span class="text-[rgba(28,26,23,.2)]">·</span>' +
              '<span>约 ' + words + ' 字</span>' +
              '<span class="tag-chip ml-auto">' + escapeHtml(a.tag) + '</span>' +
            '</div>' +
            '<p class="piece-summary text-[15px] leading-relaxed text-[#5f5850] mt-3 line-clamp-2">' + escapeHtml(a.paragraphs[0].slice(0, 62)) + '…</p>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center gap-1.5 mt-4 text-[13px] font-medium text-[rgb(var(--brand-rgb))] toggle-hint">' +
          '<span class="hint-text">展开阅读全文</span>' +
          '<svg class="w-[15px] h-[15px] shrink-0 transition-transform duration-300 chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>' +
        '</div>' +
      '</button>' +
      '<div class="piece-body mt-5 pt-5 border-t border-[rgba(28,26,23,.09)]">' +
        '<div class="piece-text text-[16px] md:text-[17px] text-[#2c2925]">' +
          a.paragraphs.map(function(p){ return '<p>' + escapeHtml(p) + '</p>'; }).join('') +
        '</div>' +
        '<div class="mt-5 pt-4 border-t border-dashed border-[rgba(28,26,23,.12)] flex items-center justify-between">' +
          '<span class="text-[13px] text-[var(--muted)]">— 全文完 · ' + escapeHtml(a.author) + '</span>' +
          '<span class="text-[13px] text-[var(--muted)]">' + words + ' 字</span>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('');
  // 展开/收起
  listEl.querySelectorAll('.piece-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      const card = btn.closest('.piece-card');
      const open = card.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      const hint = card.querySelector('.hint-text');
      const chev = card.querySelector('.chev');
      if(hint) hint.textContent = open ? '收起文章' : '展开阅读全文';
      if(chev) chev.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
      const sum = card.querySelector('.piece-summary');
      if(sum) sum.style.display = open ? 'none' : '';
    });
  });
}
/* ================= 事件 ================= */
searchInput.addEventListener('input', function(){
  keyword = searchInput.value;
  clearBtn.classList.toggle('hidden', keyword.length === 0);
  render();
});
searchInput.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ searchInput.value=''; keyword=''; clearBtn.classList.add('hidden'); render(); }
});
clearBtn.addEventListener('click', function(){
  searchInput.value = '';
  keyword = '';
  clearBtn.classList.add('hidden');
  searchInput.focus();
  render();
});
sortToggle.addEventListener('click', function(){
  sortAsc = !sortAsc;
  sortLabel.textContent = sortAsc ? 'A → Z 升序' : 'Z → A 降序';
  sortIcon.innerHTML = sortAsc
    ? '<path d="M7 4v16M7 20l-3-3M17 20V4M17 4l3 3"></path>'
    : '<path d="M7 20V4M7 4l-3 3M17 4v16M17 20l3-3"></path>';
  render();
});
/* ================= 初始化 ================= */
(function init(){
  const now = new Date();
  headerDate.textContent = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate());
  const total = ARTICLES.reduce(function(s, a){ return s + countWords(a); }, 0);
  statTotal.textContent = ARTICLES.length;
  statWords.textContent = total.toLocaleString('en-US');
  renderLetterBar();
  render();
})();
</script>
</body>
</html>
